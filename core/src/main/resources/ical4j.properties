# Nunca descargar definiciones de zonas horarias (tzurl.org u otro TZURL): todo sale de las
# incluidas en la biblioteca y de las VTIMEZONE del propio archivo.
net.fortuna.ical4j.timezone.update.enabled=false
# Caché en memoria (sin depender de JCache).
net.fortuna.ical4j.timezone.cache.impl=net.fortuna.ical4j.util.MapTimeZoneCache
# Tolerar archivos de otros programas que no siguen el RFC al pie de la letra.
ical4j.parsing.relaxed=true
ical4j.unfolding.relaxed=true
ical4j.validation.relaxed=true
ical4j.compatibility.outlook=true
ical4j.compatibility.notes=true
